name: Release

# Only version tags cut a release. Pushing any other tag publishes nothing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless cosign signing exchanges the job's OIDC token for a short-lived
  # certificate. No signing key is stored anywhere.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Matches the toolchain every CI job tests with, so release binaries are
      # built by a toolchain CI has tested.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ">=1.26.6"

      # cosign signs checksums.txt, syft writes the SBOMs. goreleaser invokes
      # both from the signs:/sboms: blocks in .goreleaser.yaml.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
